# Build the image and push it. Nothing else.
#
# The previous version called buildctl-daemonless.sh, which does not exist in
# the job image (catthehacker/ubuntu:act-24.04, per GIT_RUNNER_LABELS) — exit
# 127 — and read secrets.GIT_CLONE_TOKEN, which exists on neither the repo nor
# the hanzoai org. It had never produced an image.
#
# No deploy step on purpose: kubectl is absent from the job image too, and a
# CI-side `kubectl patch app` is reverted within minutes by cd.hanzo.ai's
# selfHeal, which restores the App CR from the reviewed pin in hanzoai/universe.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with: { driver: docker-container, driver-opts: network=host }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}
      # All 8 fission pods run /fission-bundle from ghcr.io/hanzoai/functions, so this is the image this repo owes. Context is the repo root — the Go build needs the whole module.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cmd/fission-bundle/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/hanzoai/functions:${{ steps.meta.outputs.tag }}
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GH_PAT }}
      - name: Verify the pushed image resolves
        run: |
          set -euo pipefail
          img="ghcr.io/hanzoai/functions:${{ steps.meta.outputs.tag }}"
          for i in 1 2 3 4 5 6; do
            docker buildx imagetools inspect "$img" >/dev/null 2>&1 && { echo "resolved $img"; exit 0; }
            sleep 5
          done
          echo "::error::pushed image never resolved: $img"; exit 1
