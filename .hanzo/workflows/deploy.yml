# Build the fission-bundle binary, then package it. Nothing else.
#
# cmd/fission-bundle/Dockerfile is a PACKAGING Dockerfile, not a build-from-
# source one — it is three lines on chainguard/static with `COPY fission-bundle /`.
# Handing it to buildx with no prepared binary fails with
#   failed to calculate checksum of ref ...: "/fission-bundle": not found
# so the Go build has to happen first, in the job. Upstream does this with
# goreleaser in .github/workflows/release.yaml; a plain `go build` produces the
# same single static binary this image needs.
#
# The target is not a guess: all 8 fission pods (router, executor, buildermgr,
# kubewatcher, storagesvc, timer, mqtrigger-keda, webhook-service) run
# `/fission-bundle` from ghcr.io/hanzoai/functions.
#
# No deploy step: kubectl is absent from the job image, and a CI-side
# `kubectl patch app` is reverted by cd.hanzo.ai selfHeal from the reviewed pin
# in hanzoai/universe.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      # go.mod:337 carries a LOCAL replace:
      #   replace github.com/hanzoai/commerce/metering => ../commerce/metering
      # so this module cannot build unless a sibling commerce checkout exists.
      # There is no vendor/ directory, and upstream's own release.yaml does a
      # plain single checkout — meaning it fails the same way. Supplying the
      # sibling here is the smallest fix that does not change dependency
      # resolution; removing the replace in favour of a published version is a
      # repo-owner decision, not a CI one.
      # actions/checkout REFUSES a path outside the workspace
      #   "Repository path '/workspace/hanzoai/commerce' is not under
      #    '/workspace/hanzoai/functions'"
      # so the sibling has to be cloned with plain git, which has no such rule.
      - name: Provide the sibling commerce checkout go.mod requires
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          rm -rf ../commerce
          git clone --depth 1 --quiet \
            "https://x-access-token:${GH_PAT}@github.com/hanzoai/commerce.git" ../commerce
          test -d ../commerce/metering || { echo "::error::../commerce/metering missing after clone"; exit 1; }
          echo "sibling ready: $(cd ../commerce && git rev-parse --short HEAD)"

      - id: meta
        run: echo "tag=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The dependency graph reaches PRIVATE hanzoai modules — ../commerce/metering
      # imports github.com/hanzoai/account, and `go mod download` then dies with
      #   could not read Username for 'https://github.com': terminal prompts disabled
      # GOPRIVATE keeps them off the proxy/sumdb; the insteadOf rewrite supplies
      # the credential. Both are needed — either alone still fails.
      - name: Authenticate Go to private hanzoai modules
        run: |
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE='github.com/hanzoai/*,github.com/luxfi/*'
          go env -w GOFLAGS=-mod=mod

      # CGO off + static: the runtime image is chainguard/static, which has no libc.
      - name: Build fission-bundle
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o fission-bundle ./cmd/fission-bundle
          ls -l fission-bundle

      - uses: docker/setup-buildx-action@v3
        with: { driver: docker-container, driver-opts: network=host }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cmd/fission-bundle/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/hanzoai/functions:${{ steps.meta.outputs.tag }}

      - name: Verify the pushed image resolves
        run: |
          set -euo pipefail
          img="ghcr.io/hanzoai/functions:${{ steps.meta.outputs.tag }}"
          for i in 1 2 3 4 5 6; do
            docker buildx imagetools inspect "$img" >/dev/null 2>&1 && { echo "resolved $img"; exit 0; }
            sleep 5
          done
          echo "::error::pushed image never resolved: $img"; exit 1
